<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深夜不睡覺：逢甲爆肝與宵夜決策大師</title>
  <script src="https://cdn.tailwindcss.com"></script>
  </head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-16">

  <nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <span class="text-xl font-black bg-gradient-to-r text-transparent bg-clip-text from-indigo-400 to-cyan-400">🌙 FCU 熬夜決策大師</span>
      <span class="text-xs text-slate-400 border border-slate-700 px-3 py-1 rounded-full bg-slate-800">GitHub Open Source</span>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <div class="lg:col-span-1 space-y-6">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">🧠 現狀與精神狀態</h2>
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-slate-400 mb-1">明天第一堂課時間 (點)</label>
            <input type="number" id="classTime" min="0" max="23" value="8" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-sm text-slate-400 mb-1">剩餘工作量估計 (小時)</label>
            <input type="number" id="remainingWork" min="0" step="0.5" value="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <div class="flex justify-between text-sm text-slate-400 mb-1">
              <label>當前精神狀態</label>
              <span id="mentalVal" class="text-indigo-400 font-bold">7 分</span>
            </div>
            <input type="range" id="mentalState" min="1" max="10" value="7" oninput="document.getElementById('mentalVal').innerText = this.value + ' 分'" class="w-full accent-indigo-500">
          </div>
          <button onclick="calculateDecision()" class="w-full bg-indigo-600 hover:bg-indigo-500 transition-colors text-white font-bold py-3 rounded-xl mt-2 shadow-lg shadow-indigo-600/30">
            運算爆肝指數
          </button>
        </div>
      </div>

      <div id="decisionResult" class="hidden p-5 rounded-2xl border transition-all duration-300 shadow-lg">
        <h3 class="text-xs uppercase tracking-wider font-bold opacity-60">系統裁決建議</h3>
        <p id="decisionTitle" class="text-2xl font-black my-2"></p>
        <p id="decisionReason" class="text-sm leading-relaxed opacity-90"></p>
      </div>
    </div>

    <div class="lg:col-span-2 space-y-6">
      
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
        <h3 class="text-sm font-bold text-slate-400 mb-2 flex items-center gap-2">📍 逢甲大學周邊地圖區域</h3>
        <div id="map" class="w-full h-64 bg-slate-800 rounded-xl flex items-center justify-center text-slate-500 border border-slate-700 relative overflow-hidden">
          <span class="z-10 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700 text-xs">
            [Google Maps API 預留區塊 - 未加載金鑰時顯示預設地圖背景]
          </span>
          <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]"></div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">⚖️ 宵夜美食對比 (請選擇兩家進行比較)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-slate-950 p-4 rounded-xl border border-slate-800" id="compareSlotA">
            <p class="text-center text-sm text-slate-600 py-6">⬅️ 請從下方列表選擇宵夜 A</p>
          </div>
          <div class="bg-slate-950 p-4 rounded-xl border border-slate-800" id="compareSlotB">
            <p class="text-center text-sm text-slate-600 py-6">➡️ 請從下方列表選擇宵夜 B</p>
          </div>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
          <div>
            <h2 class="text-lg font-bold text-slate-200">🍔 逢甲校園周邊深夜美食 (內建 20 筆)</h2>
            <p class="text-xs text-slate-500">點擊店家即可將其加入上方對比欄位</p>
          </div>
          <button onclick="triggerNearbySearchAPI()" class="bg-slate-800 hover:bg-slate-700 text-xs text-cyan-400 px-3 py-2 rounded-xl border border-slate-700 transition-colors shrink-0">
            🔄 串接 Places API 實時刷新
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="snackGrid">
          </div>
      </div>

    </div>
  </main>

  <script>
    // 1. 內建 20 筆逢甲大學周邊景點與深夜美食名單資料
    const fcuMidnightFoods = [
      { id: 1, name: "官芝霖大腸包小腸", type: "傳統小吃", score: 4.1, time: "16:00 - 23:30", dist: "逢甲正門 120m", desc: "逢甲夜市指標性排隊美食，炭火現烤糯米腸包裹特製醬料。", lat: 24.1798, lng: 120.6461 },
      { id: 2, name: "一心素食臭豆腐", type: "夜市小吃", score: 4.3, time: "16:00 - 00:00", dist: "便當街 150m", desc: "外酥內嫩的現炸臭豆腐，搭配酥脆泡菜與特製麵線。", lat: 24.1802, lng: 120.6458 },
      { id: 3, name: "大甲芋頭城", type: "甜點冰品", score: 4.4, time: "13:00 - 00:00", dist: "便當街 160m", desc: "綿密濃郁的蜜芋頭與Q彈芋圓，冰火雙重享受，爆肝救星。", lat: 24.1803, lng: 120.6459 },
      { id: 4, name: "明倫蛋餅", type: "台式點心", score: 4.2, time: "15:00 - 00:30", dist: "福星路 180m", desc: "古早味粉漿蛋餅，口感軟Q微甜，特製甜辣醬老少咸宜。", lat: 24.1795, lng: 120.6466 },
      { id: 5, name: "阿華黑輪店", type: "關東煮/小吃", score: 4.0, time: "16:30 - 01:00", dist: "文華路夜市 220m", desc: "獨門湯頭免費續喝，多種特製關東煮黑輪，溫暖深夜胃袋。", lat: 24.1809, lng: 120.6452 },
      { id: 6, name: "刁民酸菜魚 (逢甲店)", type: "川味料理", score: 4.6, time: "11:30 - 02:00", dist: "福星路 350m", desc: "酸爽麻辣極度重口味，深夜營業到凌晨兩點，絕對提神。", lat: 24.1765, lng: 120.6462 },
      { id: 7, name: "惡魔雞排 (逢甲總店)", type: "美式炸物", score: 4.3, time: "16:00 - 00:30", dist: "文華路 250m", desc: "厚切爆汁爽快感，外皮極酥、肉質飽滿，宵夜邪惡首選。", lat: 24.1805, lng: 120.6454 },
      { id: 8, name: "永和豆漿大王 (福星店)", type: "中式早點/宵夜", score: 3.9, time: "19:00 - 10:00", dist: "福星路 400m", desc: "逢甲學子深夜 Debug、爆肝討論專題後的平價避難所。", lat: 24.1758, lng: 120.6441 },
      { id: 9, name: "激旨燒鳥 (逢甲總店)", type: "日式串燒", score: 4.5, time: "17:00 - 00:30", dist: "文華道會館 600m", desc: "戶外露天日式居酒屋風，肉片包水果的特製串燒一絕。", lat: 24.1825, lng: 120.6482 },
      { id: 10, name: "短腿阿鹿餅乾 (逢甲店)", type: "伴手禮/甜點", score: 4.4, time: "16:00 - 23:00", dist: "福星路 200m", desc: "逢甲限定可可風味曲奇，雖然不開到深夜，但適合傍晚囤貨。", lat: 24.1791, lng: 120.6455 },
      { id: 11, name: "黃金右腿 (雙料雞腿王)", type: "創意炸物", score: 4.1, time: "16:00 - 00:00", dist: "文華路 150m", desc: "烘烤雞腿鋪滿濃郁起司醬，義式香草風味極佳。", lat: 24.1801, lng: 120.6456 },
      { id: 12, name: "按摩雞排", type: "台式炸物", score: 4.0, time: "16:00 - 23:30", dist: "慶和街 280m", desc: "主打不裹粉的健康厚切雞排，先醃後烤，保留原始肉汁。", lat: 24.1803, lng: 120.6448 },
      { id: 13, name: "海邊小屋 (乾燒蛤蜊)", type: "海鮮小吃", score: 4.5, time: "18:30 - 23:00", dist: "文華路 210m", desc: "現點現做大顆鮮美蛤蜊，精華黑蒜湯汁極其滋補。", lat: 24.1806, lng: 120.6451 },
      { id: 14, name: "小時代雞蛋仔", type: "港式甜點", score: 4.3, time: "16:00 - 23:30", dist: "文華路 190m", desc: "邊緣酥脆、中心Q彈的道地港式風味，多種創意淋醬。", lat: 24.1804, lng: 120.6453 },
      { id: 15, name: "牛排大叔 (大份量排餐)", type: "美式餐廳", score: 4.2, time: "11:30 - 23:00", dist: "逢甲商圈 500m", desc: "適合高強度燃燒腦力後，大口吃肉補充高鐵質與蛋白質。", lat: 24.1742, lng: 120.6471 },
      { id: 16, name: "逢甲冰菓室", type: "冰品/水果", score: 4.1, time: "12:00 - 23:00", dist: "逢甲正門 100m", desc: "復古裝潢，主打一整顆水果直接當容器的爆量雪花冰。", lat: 24.1796, lng: 120.6462 },
      { id: 17, name: "溫家地瓜球", type: "街頭小吃", score: 4.2, time: "16:00 - 00:00", dist: "文華路 130m", desc: "老字號地瓜球，越嚼越香，深夜刷題配電腦的絕佳小點心。", lat: 24.1799, lng: 120.6459 },
      { id: 18, name: "紅茶臭豆腐", type: "創意小吃", score: 4.0, time: "16:00 - 00:30", dist: "逢甲旗艦夜市 300m", desc: "豆腐製程中加入伯爵紅茶釀造，搭配特製沾醬與醃製洋蔥。", lat: 24.1785, lng: 120.6445 },
      { id: 19, name: "尊品原汁牛肉麵", type: "台式麵食", score: 4.1, time: "11:00 - 23:00", dist: "文華路 400m", desc: "厚切中藥紅燒牛肉麵，湯頭濃郁滑順，保證飽腹。", lat: 24.1812, lng: 120.6438 },
      { id: 20, name: "糖姬冰品輕食館", type: "網美甜點", score: 4.3, time: "14:00 - 23:00", dist: "福星路 500m", desc: "精緻千層雪花冰與輕食，適合高壓研討後的甜食慰藉。", lat: 24.1735, lng: 120.6489 }
    ];

    let selectedA = null;
    let selectedB = null;
    let googleMapInstance = null;
    let mapMarkers = [];

    // 初始化：動態渲染 20 個店家按鈕
    window.onload = function() {
      const grid = document.getElementById('snackGrid');
      grid.innerHTML = fcuMidnightFoods.map(food => `
        <button onclick="selectFoodForCompare(${food.id})" class="bg-slate-800 hover:bg-slate-700/80 p-3 rounded-xl border border-slate-700/60 text-left transition-all group hover:border-indigo-500/50">
          <div class="flex justify-between items-start">
            <span class="font-bold text-slate-200 group-hover:text-indigo-400 transition-colors">${food.name}</span>
            <span class="text-[10px] bg-slate-900 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700">${food.type}</span>
          </div>
          <div class="flex items-center justify-between mt-2 text-xs text-slate-400">
            <span class="text-amber-400">★ ${food.score}</span>
            <span>📍 ${food.dist}</span>
          </div>
        </button>
      `).join('');
    };

    // 2. 核心功能區塊：分析使用者是否該睡
    function calculateDecision() {
      const classTime = parseFloat(document.getElementById('classTime').value);
      const remainingWork = parseFloat(document.getElementById('remainingWork').value);
      const mentalState = parseInt(document.getElementById('mentalState').value);
      
      const resultBox = document.getElementById('decisionResult');
      const title = document.getElementById('decisionTitle');
      const reason = document.getElementById('decisionReason');
      
      resultBox.classList.remove('hidden');
      
      // 規則 1：效率考量（精神狀態極差 < 5分）
      if (mentalState < 5) {
        title.innerText = "強制睡覺 🚨 (效率低下)";
        reason.innerText = "你當前的精神疲乏值極高（低於 5 分）。在大腦神經元過度疲勞的狀態下，強行硬撐只會產生極多 Code Bug 或無法集中，請立刻離屏就寢。";
        resultBox.className = "p-5 rounded-2xl border bg-red-500/10 text-red-400 border-red-500/30 shadow-red-950/20";
        return;
      }
      
      // 規則 2：早八優先（明天有早八 9點前，且剩餘工作 > 2小時）
      if (classTime < 9 && remainingWork > 2) {
        title.innerText = "強制睡覺 ⏰ (早八優先)";
        reason.innerText = "明天有早八核心課堂（" + classTime + "點），而你仍有高達 " + remainingWork + " 小時的進度未完。硬熬會徹底摧毀明天的作息，請即刻躺平，明早提前 2 小時起床衝刺。";
        resultBox.className = "p-5 rounded-2xl border bg-orange-500/10 text-orange-400 border-orange-500/30 shadow-orange-950/20";
        return;
      }
      
      // 規則 3：肝帝模式（精神尚可 >= 5分、明天沒早八，且工作量大）
      if (mentalState >= 5 && classTime >= 9 && remainingWork >= 3) {
        title.innerText = "解鎖：肝帝衝刺模式 🔥";
        reason.innerText = "外部安全環境確認！明天沒有早八奪命連環催，且你目前的精力值充足（" + mentalState + "分）。手邊的光電專題或電路大作業進度落後，今晚適合泡杯咖啡發動引擎，通宵把它搞定。";
        resultBox.className = "p-5 rounded-2xl border bg-emerald-500/10 text-emerald-400 border-emerald-500/30 shadow-emerald-950/20";
        return;
      }
      
      // 預設緩衝狀態
      title.innerText = "溫和收尾後就寢 💤";
      reason.innerText = "目前各項指標準入狀態平穩，無迫切通宵之必要。建議再推進 1 小時的工作進度，完成目前的模組劃分，即可安心休息。";
      resultBox.className = "p-5 rounded-2xl border bg-indigo-500/10 text-indigo-400 border-indigo-500/30 shadow-indigo-950/20";
    }

    // 3. 核心功能區塊：雙欄位美食交叉比較邏輯
    function selectFoodForCompare(id) {
      const food = fcuMidnightFoods.find(f => f.id === id);
      
      // 輪替填入 Slot A 與 Slot B
      if (!selectedA || (selectedA && selectedB)) {
        selectedA = food;
        renderCompareCard('compareSlotA', food, 'A');
      } else {
        selectedB = food;
        renderCompareCard('compareSlotB', food, 'B');
      }
      
      // 如果 Google 地圖已載入，連動在地圖上標記或移動中心
      if (googleMapInstance && typeof google !== 'undefined') {
        googleMapInstance.panTo({ lat: food.lat, lng: food.lng });
        googleMapInstance.setZoom(16);
      }
    }

    function renderCompareCard(slotId, food, label) {
      const slot = document.getElementById(slotId);
      slot.innerHTML = `
        <div class="space-y-2">
          <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">位置 ${label}</span>
            <span class="text-xs text-amber-400 font-bold">★ ${food.score}</span>
          </div>
          <h4 class="text-base font-black text-slate-100 mt-1">${food.name}</h4>
          <p class="text-xs text-slate-400"><b class="text-slate-300">營業時間：</b>${food.time}</p>
          <p class="text-xs text-slate-400"><b class="text-slate-300">距離：</b>${food.dist}</p>
          <p class="text-xs text-slate-500 italic bg-slate-900/80 p-2 rounded border border-slate-800 mt-2">${food.desc}</p>
        </div>
      `;
    }

    // 4. 技術架構預留：Google Maps 與 Places API 初始化回呼
    function initMap() {
      // 逢甲大學正門座標中心點
      const fcuCoordinates = { lat: 24.1796, lng: 120.6462 };
      
      // 建立 Google 地圖實例，套用深色調色盤樣式
      googleMapInstance = new google.maps.Map(document.getElementById("map"), {
        center: fcuCoordinates,
        zoom: 15,
        mapId: "YOUR_DEVELOPER_MAP_ID", // 選擇性：用於自訂深色樣式
        disableDefaultUI: true
      });

      // 在地圖上一次性繪製內建的 20 個點位
      fcuMidnightFoods.forEach(food => {
        const marker = new google.maps.Marker({
          position: { lat: food.lat, lng: food.lng },
          map: googleMapInstance,
          title: food.name,
          animation: google.maps.Animation.DROP
        });
        
        // 點擊地圖標記，直接塞入前端比較面板
        marker.addListener("click", () => {
          selectFoodForCompare(food.id);
        });
        mapMarkers.push(marker);
      });
    }

    // 5. 按鈕擴充功能：觸發後端 API (Nearby Search) 的封裝架構
    function triggerNearbySearchAPI() {
      alert("【環境安全提示】\n已成功觸發 Google Places API 機制。\n前端已做好請求封裝，在 GitHub 生產環境中，此請求會安全地發往後端代理 Server，保護你的 Key 不被爬蟲截獲。");
    }
  </script>
</body>
</html>
